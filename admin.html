<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台發文｜投資筆記</title>
<link rel="icon" href="avatar.jpg">
<meta name="theme-color" content="#0a0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* ---------- 後台專用樣式(不影響正式文章頁) ---------- */
  .admin-wrap{ max-width: 1180px; padding-bottom: 60px; }

  .admin-grid{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap: 26px;
    padding-top: 32px;
    align-items:stretch;
  }
  @media (max-width: 900px){
    .admin-grid{ grid-template-columns: 1fr; }
  }

  /* -- 左側：編輯區 -- */
  .editor-col{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 30px 36px;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .editor-wrapper{
    position:relative;
    display:flex;
    gap:12px;
    flex:1;
    min-height:0;
  }
  .progress-track{
    flex-shrink:0;
    width:3px;
    height:auto;
    align-self:stretch;
    background: var(--border);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-bar{
    width:100%;
    height:60px;
    background: var(--accent);
    border-radius:2px;
    transition: transform 0.05s ease-out;
    transform-origin: top;
    opacity:0.7;
  }

  .edit-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.08);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 9px 13px;
    margin-bottom: 18px;
  }
  .edit-banner #editBannerTitle{ color: var(--text-primary); font-weight:600; margin-left:4px; }
  .edit-banner button{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 9px;
    cursor:pointer;
    flex-shrink:0;
  }
  .edit-banner button:hover{ color: var(--text-primary); border-color: var(--text-secondary); }

  .input-title, .input-subtitle{
    display:block;
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color: var(--heading);
    font-family: var(--font-zh);
    font-weight:900;
  }
  .input-title{
    font-size: clamp(24px, 3.4vw, 32px);
    margin-bottom: 10px;
  }
  .input-title::placeholder{ color: var(--text-tertiary); -webkit-text-fill-color: var(--text-tertiary); opacity:1; }
  .input-subtitle{
    font-size: 15px;
    font-weight:400;
    color: var(--text-secondary);
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 18px;
  }
  .input-subtitle::placeholder{ color: var(--text-tertiary); }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  .toolbar button{
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    cursor:pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .toolbar button:hover{ color: var(--accent); border-color: var(--accent); }
  .toolbar .sep{ width:1px; background:var(--border); margin:2px 6px; }
  .toolbar .btn-align{ font-size:14px; line-height:1; padding:5px 9px; }
  .tb-select{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 6px;
    cursor:pointer;
    max-width: 92px;
  }
  .tb-select:hover{ border-color: var(--accent); color: var(--accent); }
  .tb-color{
    display:flex;
    align-items:center;
    gap:4px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    cursor:pointer;
  }
  .tb-color:hover{ border-color: var(--accent); }
  .tb-color input[type="color"]{
    width:18px; height:18px;
    padding:0;
    border:none;
    background:none;
    cursor:pointer;
  }
  .tb-color .hl-swatch{
    display:inline-block;
    padding:0 2px;
    border-radius:2px;
    background: rgba(251,191,36,0.3);
  }

  .editor-body{
    flex:1;
    align-self:stretch;
    min-height: 200px;
    overflow-y: scroll;
    outline:none;
    font-size: 15.5px;
    padding-right:10px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--bg);
  }
  .editor-body::-webkit-scrollbar{
    width:8px;
  }
  .editor-body::-webkit-scrollbar-track{
    background: var(--bg);
    border-radius:4px;
    border: 1px solid var(--border);
  }
  .editor-body::-webkit-scrollbar-thumb{
    background: var(--accent);
    border-radius:4px;
    opacity:0.7;
  }
  .editor-body::-webkit-scrollbar-thumb:hover{
    background: var(--heading);
  }
  .editor-body.empty:before{
    content: attr(data-placeholder);
    color: var(--text-tertiary);
  }
  .editor-body img{ max-width:100%; }

  /* -- 右側：設定欄 -- */
  .admin-grid > aside{
    display:flex;
    flex-direction:column;
  }
  .admin-grid > aside .panel:last-of-type{
    flex:1;
  }
  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .panel h3{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 5px;
    font-family: var(--font-mono);
  }
  .field input{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--text-primary);
    font-size: 13.5px;
    font-family: var(--font-mono);
  }
  .field input:focus{ outline:none; border-color: var(--accent); }
  .hint{
    font-size: 11.5px;
    color: var(--text-tertiary);
    line-height:1.6;
    margin-top: 8px;
  }
  .hint b{ color: var(--text-secondary); }

  .btn{
    width:100%;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 11px;
    border-radius: 5px;
    cursor:pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    margin-bottom: 10px;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn:hover{ border-color: var(--text-secondary); color: var(--text-primary); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #14100d;
    font-weight:600;
  }
  .btn.primary:hover{ filter: brightness(1.08); }
  .btn:disabled{ opacity:.5; cursor:default; }

  #statusMsg{
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height:1.7;
    padding: 12px 14px;
    border-radius: 5px;
    display:none;
  }
  #statusMsg.show{ display:block; }
  #statusMsg.ok{ background: var(--green-dim); color: var(--green); }
  #statusMsg.err{ background: #3a1616; color: #f87171; }
  #statusMsg.busy{ background: var(--bg); color: var(--text-secondary); border:1px solid var(--border); }
  #statusMsg a{ color:inherit; text-decoration:underline; }
  #manageStatus{ font-family: var(--font-mono); font-size:12.5px; line-height:1.7; padding:12px 14px; border-radius:5px; display:none; margin-top:12px; }
  #manageStatus.show{ display:block; }
  #manageStatus.ok{ background: var(--green-dim); color: var(--green); }
  #manageStatus.err{ background: #3a1616; color: #f87171; }
  #manageStatus.busy{ background: var(--bg); color: var(--text-secondary); border:1px solid var(--border); }


  /* -- 文章管理 -- */
  .manage-panel{ margin-top: 24px; }
  .manage-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
  }
  .manage-list{ display:flex; flex-direction:column; gap:10px; }
  .manage-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 12px 14px;
  }
  .manage-item.is-hidden{ opacity:.55; }
  .manage-item .mi-info{ min-width:0; }
  .manage-item .mi-title{
    color: var(--text-primary);
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .manage-item .mi-meta{
    font-family: var(--font-mono);
    font-size:11.5px;
    color: var(--text-tertiary);
    margin-top:3px;
  }
  .manage-item .mi-actions{ display:flex; gap:8px; flex-shrink:0; }
  .manage-item .mi-actions button{
    font-family: var(--font-mono);
    font-size:12px;
    padding:6px 11px;
    border-radius:4px;
    border:1px solid var(--border);
    background:transparent;
    color: var(--text-secondary);
    cursor:pointer;
  }
  .manage-item .mi-actions button:hover{ border-color: var(--accent); color: var(--accent); }
  .manage-item .mi-actions button.danger:hover{ border-color:#f87171; color:#f87171; }
</style>
</head>
<body>

<div class="wrap admin-wrap">
  <header>
    <div class="header-row">
      <a class="brand" href="index.html" style="align-items:center;">
        <img class="avatar" src="avatar.jpg" alt="LeverageVolatilityLife">
        <b>後台發文 · 投資筆記</b>
      </a>
      <div class="header-right">
        <a class="breadcrumb" href="index.html" style="margin:0;">← 回到文章列表</a>
      </div>
    </div>
  </header>

  <div class="admin-grid">
    <div class="editor-col">
      <div id="editBanner" class="edit-banner" style="display:none;">
        正在編輯:<span id="editBannerTitle"></span>
        <button type="button" id="btnCancelEdit">取消,改寫新文章</button>
      </div>
      <input id="fTitle" class="input-title" placeholder="文章標題" />
      <input id="fSummary" class="input-subtitle" placeholder="副標題 / 摘要(會顯示在列表頁卡片上)" />

      <div class="toolbar">
        <select id="selFontFamily" class="tb-select" title="字型">
          <option value="">字型</option>
          <option value="'Noto Sans TC', sans-serif">內文(預設)</option>
          <option value="'Space Grotesk', sans-serif">標題感</option>
          <option value="'JetBrains Mono', monospace">等寬</option>
          <option value="Georgia, 'Noto Serif TC', serif">襯線</option>
        </select>
        <select id="selFontSize" class="tb-select" title="字級">
          <option value="">字級</option>
          <option value="13px">小</option>
          <option value="15.5px">預設</option>
          <option value="18px">中</option>
          <option value="22px">大</option>
          <option value="28px">特大</option>
        </select>
        <span class="sep"></span>
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <span class="sep"></span>
        <button type="button" data-block="H2">大標</button>
        <button type="button" data-block="H3">小標</button>
        <button type="button" data-block="P">正文</button>
        <button type="button" data-block="BLOCKQUOTE">引用</button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList">• list</button>
        <button type="button" data-cmd="insertOrderedList">1. list</button>
        <span class="sep"></span>
        <button type="button" data-align="left" class="btn-align" title="靠左">⯇</button>
        <button type="button" data-align="center" class="btn-align" title="置中">☰</button>
        <button type="button" data-align="right" class="btn-align" title="靠右">⯈</button>
        <button type="button" data-align="justify" class="btn-align" title="左右對齊">≡</button>
        <span class="sep"></span>
        <label class="tb-color" title="文字顏色">
          A<input type="color" id="inpFontColor" value="#e7edf3">
        </label>
        <label class="tb-color" title="醒目顏色">
          <span class="hl-swatch">H</span><input type="color" id="inpHiliteColor" value="#fbbf24">
        </label>
        <button type="button" id="btnClearHilite" title="清除醒目">清除醒目</button>
        <span class="sep"></span>
        <button type="button" id="btnLink">連結</button>
        <button type="button" id="btnImage">插入圖片</button>
        <span class="sep"></span>
        <button type="button" data-cmd="undo">↺</button>
        <button type="button" data-cmd="redo">↻</button>
      </div>
      <input type="file" id="fileImage" accept="image/*" style="display:none">

      <div class="editor-wrapper">
        <div id="editor" class="editor-body prose" contenteditable="true" data-placeholder="開始寫內文…點工具列插入標題、引用或圖片"></div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <h3>發布設定</h3>
        <div class="field">
          <label>標籤(逗號分隔)</label>
          <input id="fTags" placeholder="策略邏輯, 回測">
        </div>
        <div class="field">
          <label>發布日期</label>
          <input id="fDate" type="date">
        </div>
      </div>

      <div class="panel">
        <h3>GitHub 連線</h3>
        <div class="field">
          <label>Owner</label>
          <input id="ghOwner" value="leveragevolatilitylife">
        </div>
        <div class="field">
          <label>Repo</label>
          <input id="ghRepo" value="TWN-Investment-Notes">
        </div>
        <div class="field">
          <label>Branch</label>
          <input id="ghBranch" value="main">
        </div>
        <div class="field">
          <label>Personal Access Token</label>
          <input id="ghToken" type="password" placeholder="ghp_...">
        </div>
        <p class="hint">Token 只會存在<b>你這台電腦的瀏覽器</b>裡(localStorage),直接呼叫 GitHub API,不會經過任何其他伺服器。建議用 Fine-grained token,只勾這個 repo、權限設 Contents: Read and write,並設過期日。</p>
      </div>

      <button class="btn" id="btnDraft">儲存草稿(僅本機)</button>
      <button class="btn primary" id="btnPublish">發布到投資筆記</button>
      <div id="statusMsg"></div>
    </aside>
  </div>

  <section class="panel manage-panel">
    <div class="manage-head">
      <h3 style="margin:0;">文章管理</h3>
      <button class="btn" id="btnRefreshList" style="width:auto; margin:0; padding:7px 14px;">重新整理列表</button>
    </div>
    <div id="manageList" class="manage-list">
      <p class="hint">填好右上角的 GitHub 連線資訊後,按「重新整理列表」載入目前所有文章。</p>
    </div>
    <div id="manageStatus"></div>
  </section>
</div>

<script>
(function(){
  const editor = document.getElementById('editor');
  const fTitle = document.getElementById('fTitle');
  const fSummary = document.getElementById('fSummary');
  const fTags = document.getElementById('fTags');
  const fDate = document.getElementById('fDate');
  const statusEl = document.getElementById('statusMsg');
  const DRAFT_KEY = 'notes_admin_draft_v1';

  fDate.value = new Date().toISOString().slice(0,10);

  function refreshEmptyState(){
    const isEmpty = editor.textContent.trim() === '' && !editor.querySelector('img');
    editor.classList.toggle('empty', isEmpty);
  }
  refreshEmptyState();
  editor.addEventListener('input', refreshEmptyState);

  // ---------- 編輯區高度對齊「發布到投資筆記」按鈕下緣 ----------
  const editorWrapperEl = document.querySelector('.editor-wrapper');
  const btnPublishForHeight = document.getElementById('btnPublish');
  function syncEditorHeight(){
    if (!editorWrapperEl || !btnPublishForHeight) return;
    if (window.innerWidth <= 900){
      editorWrapperEl.style.height = '';
      return;
    }
    editorWrapperEl.style.height = '';
    const wrapTop = editorWrapperEl.getBoundingClientRect().top;
    const btnBottom = btnPublishForHeight.getBoundingClientRect().bottom;
    const targetHeight = btnBottom - wrapTop;
    if (targetHeight > 0){
      editorWrapperEl.style.height = targetHeight + 'px';
    }
    if (typeof updateProgressBar === 'function') updateProgressBar();
  }
  window.addEventListener('load', syncEditorHeight);
  window.addEventListener('resize', syncEditorHeight);
  setTimeout(syncEditorHeight, 0);
  setTimeout(syncEditorHeight, 300);

  // ---------- 滾動進度條 ----------
  const progressBar = document.getElementById('progressBar');
  const progressTrack = progressBar.parentElement;
  function updateProgressBar(){
    const scrollTop = editor.scrollTop;
    const scrollHeight = editor.scrollHeight;
    const clientHeight = editor.clientHeight;
    const scrollableHeight = scrollHeight - clientHeight;
    if (scrollableHeight === 0) {
      progressBar.style.transform = 'translateY(0)';
      progressBar.style.height = '100%';
    } else {
      const scrollPercent = scrollTop / scrollableHeight;
      const trackHeight = progressTrack.clientHeight;
      const barHeight = (clientHeight / scrollHeight) * trackHeight;
      const barTop = scrollPercent * (trackHeight - barHeight);
      progressBar.style.height = barHeight + 'px';
      progressBar.style.transform = 'translateY(' + barTop + 'px)';
    }
  }
  editor.addEventListener('scroll', updateProgressBar);
  editor.addEventListener('input', updateProgressBar);
  window.addEventListener('resize', updateProgressBar);
  updateProgressBar();


  // ---------- 工具列 ----------
  document.querySelectorAll('.toolbar [data-cmd]').forEach(function(btn){
    btn.addEventListener('click', function(){
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });
  document.querySelectorAll('.toolbar [data-block]').forEach(function(btn){
    btn.addEventListener('click', function(){
      editor.focus();
      document.execCommand('formatBlock', false, btn.dataset.block);
    });
  });
  document.querySelectorAll('.toolbar [data-align]').forEach(function(btn){
    btn.addEventListener('click', function(){
      editor.focus();
      const cmd = { left: 'justifyLeft', center: 'justifyCenter', right: 'justifyRight', justify: 'justifyFull' }[btn.dataset.align];
      document.execCommand(cmd, false, null);
    });
  });

  // 字型
  document.getElementById('selFontFamily').addEventListener('change', function(){
    if (!this.value) return;
    editor.focus();
    document.execCommand('fontName', false, this.value);
    this.selectedIndex = 0;
  });

  // 字級(先用 execCommand 的 font size=7 佔位,再把 <font size="7"> 轉成實際 px 的 span)
  document.getElementById('selFontSize').addEventListener('change', function(){
    if (!this.value) return;
    const px = this.value;
    editor.focus();
    document.execCommand('fontSize', false, '7');
    editor.querySelectorAll('font[size="7"]').forEach(function(el){
      el.removeAttribute('size');
      el.style.fontSize = px;
    });
    this.selectedIndex = 0;
  });

  // 文字顏色
  document.getElementById('inpFontColor').addEventListener('input', function(){
    editor.focus();
    document.execCommand('foreColor', false, this.value);
  });

  // 醒目顏色(標記)
  document.getElementById('inpHiliteColor').addEventListener('input', function(){
    editor.focus();
    try {
      if (!document.execCommand('hiliteColor', false, this.value)) {
        document.execCommand('backColor', false, this.value);
      }
    } catch(e){
      document.execCommand('backColor', false, this.value);
    }
  });
  document.getElementById('btnClearHilite').addEventListener('click', function(){
    editor.focus();
    try {
      if (!document.execCommand('hiliteColor', false, 'transparent')) {
        document.execCommand('backColor', false, 'transparent');
      }
    } catch(e){
      document.execCommand('backColor', false, 'transparent');
    }
  });

  document.getElementById('btnLink').addEventListener('click', function(){
    const url = prompt('連結網址(https://...)');
    if (url) { editor.focus(); document.execCommand('createLink', false, url); }
  });
  document.getElementById('btnImage').addEventListener('click', function(){
    document.getElementById('fileImage').click();
  });
  document.getElementById('fileImage').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      editor.focus();
      document.execCommand('insertImage', false, reader.result);
      refreshEmptyState();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // ---------- 草稿(本機) ----------
  function collectDraft(){
    return {
      title: fTitle.value,
      summary: fSummary.value,
      tags: fTags.value,
      date: fDate.value,
      content: editor.innerHTML
    };
  }
  function loadDraft(){
    let raw;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch(e){ return; }
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      fTitle.value = d.title || '';
      fSummary.value = d.summary || '';
      fTags.value = d.tags || '';
      if (d.date) fDate.value = d.date;
      editor.innerHTML = d.content || '';
      refreshEmptyState();
      showStatus('busy', '已還原本機草稿。');
    } catch(e){}
  }
  document.getElementById('btnDraft').addEventListener('click', function(){
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(collectDraft()));
      showStatus('ok', '草稿已存在這台電腦的瀏覽器裡。');
    } catch(e){
      showStatus('err', '草稿儲存失敗:' + e.message);
    }
  });
  loadDraft();

  // GitHub 連線設定也記住(token 另外存,方便下次打開直接用)
  ['ghOwner','ghRepo','ghBranch','ghToken'].forEach(function(id){
    const el = document.getElementById(id);
    const key = 'notes_admin_' + id;
    const saved = localStorage.getItem(key);
    if (saved) el.value = saved;
    el.addEventListener('change', function(){ localStorage.setItem(key, el.value); });
  });

  // ---------- 狀態訊息 ----------
  function showStatus(kind, html){
    statusEl.className = 'show ' + kind;
    statusEl.innerHTML = html;
  }

  // ---------- 工具函式 ----------
  function slugify(title, dateStr){
    const ascii = title
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .toLowerCase();
    return (dateStr + '-' + (ascii || 'post')).slice(0, 60);
  }
  function utf8ToBase64(str){
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    bytes.forEach(function(b){ binary += String.fromCharCode(b); });
    return btoa(binary);
  }
  function base64ToUtf8(b64){
    const binary = atob(b64.replace(/\n/g, ''));
    const bytes = Uint8Array.from(binary, function(c){ return c.charCodeAt(0); });
    return new TextDecoder().decode(bytes);
  }

  function ghHeaders(token){
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  async function ghGetFile(cfg, path){
    const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path + '?ref=' + cfg.branch;
    const res = await fetch(url, { headers: ghHeaders(cfg.token) });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('讀取 ' + path + ' 失敗(' + res.status + ')');
    return res.json();
  }
  async function ghPutFile(cfg, path, contentBase64, message, sha){
    const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path;
    const body = { message: message, content: contentBase64, branch: cfg.branch };
    if (sha) body.sha = sha;
    const res = await fetch(url, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(cfg.token)),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errBody = await res.json().catch(function(){ return {}; });
      throw new Error('寫入 ' + path + ' 失敗(' + res.status + '):' + (errBody.message || res.statusText));
    }
    return res.json();
  }
  async function ghDeleteFile(cfg, path, message, sha){
    const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path;
    const res = await fetch(url, {
      method: 'DELETE',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(cfg.token)),
      body: JSON.stringify({ message: message, sha: sha, branch: cfg.branch })
    });
    if (!res.ok) {
      const errBody = await res.json().catch(function(){ return {}; });
      throw new Error('刪除 ' + path + ' 失敗(' + res.status + '):' + (errBody.message || res.statusText));
    }
    return res.json();
  }
  function currentCfg(){
    return {
      owner: document.getElementById('ghOwner').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      branch: document.getElementById('ghBranch').value.trim() || 'main',
      token: document.getElementById('ghToken').value.trim()
    };
  }

  function buildPostHtml(opts){
    // opts: title, date, tagsText, summary, contentHtml
    return '<!DOCTYPE html>\n' +
'<html lang="zh-Hant">\n' +
'<head>\n' +
'<meta charset="UTF-8">\n' +
'<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
'<title>' + esc(opts.title) + '｜投資筆記｜Yung\'s Journey to FIRE</title>\n' +
'<meta name="description" content="' + esc(opts.summary) + '">\n' +
'<link rel="icon" href="avatar.jpg">\n' +
'<meta name="theme-color" content="#0a0e14">\n' +
'<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
'<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">\n' +
'<link rel="stylesheet" href="assets/site.css">\n' +
'</head>\n' +
'<body>\n\n' +
'<div class="wrap narrow">\n' +
'  <header>\n' +
'    <div class="header-row">\n' +
'      <a class="brand" href="https://leveragevolatilitylife.github.io/" style="align-items:center;">\n' +
'        <img class="avatar" src="avatar.jpg" alt="LeverageVolatilityLife">\n' +
'        <b>Yung\'s Journey to FIRE｜Investing with Leverage &amp; Volatility</b>\n' +
'      </a>\n' +
'      <div class="header-right">\n' +
'        <div class="social">\n' +
'          <span class="handle">@leverage_volatility_life</span>\n' +
'          <a href="https://www.instagram.com/leverage_volatility_life/" target="_blank" rel="noopener">IG</a>\n' +
'          <a href="https://www.threads.net/@leverage_volatility_life" target="_blank" rel="noopener">Threads</a>\n' +
'        </div>\n' +
'      </div>\n' +
'    </div>\n' +
'  </header>\n\n' +
'  <section class="page-intro" style="padding-top:48px;">\n' +
'    <a class="breadcrumb" href="index.html">← 回到投資筆記</a>\n' +
'    <div class="eyebrow-line">NOTES</div>\n' +
'    <h1>' + esc(opts.title) + '</h1>\n' +
'  </section>\n\n' +
'  <div class="article-meta">\n' +
'    <span>' + opts.date + '</span>\n' +
'    <span>·</span>\n' +
'    <span>' + esc(opts.tagsText || '未分類') + '</span>\n' +
'  </div>\n\n' +
'  <article class="prose">\n' +
'    <p class="lead">' + esc(opts.summary) + '</p>\n' +
'    ' + opts.contentHtml + '\n' +
'  </article>\n\n' +
'  <footer>\n' +
'    <p class="disclaimer">本網站與所連結頁面之內容僅為個人資料整理與策略追蹤工具,不構成任何投資建議。</p>\n' +
'    <div class="links"><span id="footYear"></span></div>\n' +
'  </footer>\n' +
'</div>\n\n' +
'<script>\n' +
'  document.getElementById(\'footYear\').textContent = new Date().getFullYear() + \' · Personal Project\';\n' +
'<' + '/script>\n\n' +
'</body>\n' +
'</html>\n';
  }
  function esc(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- 發布 ----------
  document.getElementById('btnPublish').addEventListener('click', async function(){
    const btn = this;
    const cfg = currentCfg();
    const title = fTitle.value.trim();
    const summary = fSummary.value.trim();
    const tagsText = fTags.value.trim();
    const tags = tagsText ? tagsText.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];
    const dateStr = fDate.value || new Date().toISOString().slice(0,10);

    if (!title){ showStatus('err', '請先填標題。'); return; }
    if (!cfg.owner || !cfg.repo || !cfg.token){ showStatus('err', '請填寫 GitHub owner / repo / token。'); return; }

    const isEdit = !!editingSlug;
    btn.disabled = true;
    try {
      let slug = editingSlug;
      let existingPostSha = undefined;
      if (isEdit){
        showStatus('busy', '正在讀取原文章…');
        const existing = await ghGetFile(cfg, slug + '.html');
        if (existing) existingPostSha = existing.sha;
      } else {
        showStatus('busy', '正在確認文章網址…');
        slug = slugify(title, dateStr);
        // 避免檔名撞名
        for (let i = 2; i < 20; i++){
          const exists = await ghGetFile(cfg, slug + '.html');
          if (!exists) break;
          slug = slugify(title, dateStr) + '-' + i;
        }
      }

      // 處理內文裡的圖片(base64 -> 上傳成檔案;既有圖片路徑原樣保留)
      showStatus('busy', '正在處理圖片…');
      const tmp = document.createElement('div');
      tmp.innerHTML = editor.innerHTML;
      const imgs = Array.prototype.slice.call(tmp.querySelectorAll('img[src^="data:"]'));
      for (let i = 0; i < imgs.length; i++){
        const img = imgs[i];
        const match = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/.exec(img.getAttribute('src'));
        if (!match) continue;
        const mime = match[1];
        const b64 = match[2];
        const ext = (mime.split('/')[1] || 'png').replace('jpeg','jpg');
        const filename = 'img-' + (i+1) + '.' + ext;
        const path = 'assets/images/' + slug + '/' + filename;
        showStatus('busy', '正在上傳圖片 ' + (i+1) + ' / ' + imgs.length + '…');
        await ghPutFile(cfg, path, b64, '新增文章圖片: ' + slug + '/' + filename);
        img.setAttribute('src', path);
        img.removeAttribute('style');
      }
      const contentHtml = tmp.innerHTML;

      // 建立文章 HTML 並上傳
      showStatus('busy', isEdit ? '正在更新文章頁面…' : '正在建立文章頁面…');
      const postHtml = buildPostHtml({ title: title, date: dateStr, tagsText: tags.join('、'), summary: summary, contentHtml: contentHtml });
      await ghPutFile(cfg, slug + '.html', utf8ToBase64(postHtml), (isEdit ? '更新文章: ' : '新增文章: ') + title, existingPostSha);

      // 更新 posts.json
      showStatus('busy', '正在更新文章列表…');
      const postsFile = await ghGetFile(cfg, 'posts.json');
      let posts = [];
      let sha = undefined;
      if (postsFile){
        posts = JSON.parse(base64ToUtf8(postsFile.content));
        sha = postsFile.sha;
      }
      let savedEntry;
      if (isEdit){
        const idx = posts.findIndex(function(p){ return p.slug === slug; });
        const prevHidden = idx > -1 ? posts[idx].hidden : undefined;
        savedEntry = { slug: slug, title: title, date: dateStr, summary: summary, tags: tags };
        if (prevHidden) savedEntry.hidden = true;
        if (idx > -1) posts[idx] = savedEntry; else posts.unshift(savedEntry);
      } else {
        savedEntry = { slug: slug, title: title, date: dateStr, summary: summary, tags: tags };
        posts.unshift(savedEntry);
      }
      const postsRes = await ghPutFile(cfg, 'posts.json', utf8ToBase64(JSON.stringify(posts, null, 2) + '\n'), (isEdit ? '更新文章列表: ' : '新增文章列表: ') + title, sha);

      // 同步「文章管理」清單裡的資料,不用再手動重新整理
      currentPosts = posts;
      currentPostsSha = postsRes.content.sha;
      renderManageList();

      const liveUrl = 'https://' + cfg.owner + '.github.io/' + cfg.repo + '/' + slug + '.html';
      showStatus('ok', (isEdit ? '更新成功!' : '發布成功!') + 'GitHub Pages 重新部署約需 1 分鐘。<br>完成後可到 <a href="' + liveUrl + '" target="_blank">' + liveUrl + '</a> 查看。');

      try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
      exitEditMode();

    } catch(err){
      showStatus('err', (isEdit ? '更新失敗:' : '發布失敗:') + err.message);
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- 文章管理 ----------
  const manageListEl = document.getElementById('manageList');
  const manageStatusEl = document.getElementById('manageStatus');
  let currentPostsSha = null;
  let editingSlug = null;
  let currentPosts = [];

  function showManageStatus(kind, html){
    manageStatusEl.className = 'show ' + kind;
    manageStatusEl.innerHTML = html;
  }

  const editBanner = document.getElementById('editBanner');
  const editBannerTitle = document.getElementById('editBannerTitle');
  const btnPublishEl = document.getElementById('btnPublish');

  function enterEditMode(post, contentHtml){
    editingSlug = post.slug;
    fTitle.value = post.title || '';
    fSummary.value = post.summary || '';
    fTags.value = (post.tags || []).join(', ');
    fDate.value = post.date || fDate.value;
    editor.innerHTML = contentHtml || '';
    refreshEmptyState();
    editBannerTitle.textContent = post.title;
    editBanner.style.display = 'flex';
    btnPublishEl.textContent = '更新文章';
    try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
    document.querySelector('.editor-col').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function exitEditMode(){
    editingSlug = null;
    editBanner.style.display = 'none';
    btnPublishEl.textContent = '發布到投資筆記';
    fTitle.value = ''; fSummary.value = ''; fTags.value = '';
    fDate.value = new Date().toISOString().slice(0,10);
    editor.innerHTML = ''; refreshEmptyState();
  }
  document.getElementById('btnCancelEdit').addEventListener('click', exitEditMode);

  function renderManageList(){
    if (!currentPosts.length){
      manageListEl.innerHTML = '<p class="hint">目前沒有任何文章。</p>';
      return;
    }
    const sorted = currentPosts.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    manageListEl.innerHTML = sorted.map(function(p){
      return (
        '<div class="manage-item' + (p.hidden ? ' is-hidden' : '') + '" data-slug="' + p.slug + '">' +
          '<div class="mi-info">' +
            '<div class="mi-title">' + esc(p.title) + (p.hidden ? '(已隱藏)' : '') + '</div>' +
            '<div class="mi-meta">' + p.date + ' · ' + p.slug + '.html</div>' +
          '</div>' +
          '<div class="mi-actions">' +
            '<button type="button" class="btn-edit">編輯</button>' +
            '<button type="button" class="btn-toggle">' + (p.hidden ? '顯示' : '隱藏') + '</button>' +
            '<button type="button" class="btn-delete danger">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('btnRefreshList').addEventListener('click', async function(){
    const cfg = currentCfg();
    if (!cfg.owner || !cfg.repo || !cfg.token){ showManageStatus('err', '請先填寫右上角的 GitHub owner / repo / token。'); return; }
    showManageStatus('busy', '載入中…');
    try {
      const file = await ghGetFile(cfg, 'posts.json');
      currentPosts = file ? JSON.parse(base64ToUtf8(file.content)) : [];
      currentPostsSha = file ? file.sha : null;
      renderManageList();
      showManageStatus('ok', '已載入 ' + currentPosts.length + ' 篇文章。');
    } catch(err){
      showManageStatus('err', '載入失敗:' + err.message);
    }
  });

  manageListEl.addEventListener('click', async function(e){
    const item = e.target.closest('.manage-item');
    if (!item) return;
    const slug = item.dataset.slug;
    const post = currentPosts.find(function(p){ return p.slug === slug; });
    if (!post) return;
    const cfg = currentCfg();
    if (!cfg.token){ showManageStatus('err', '請先填寫 GitHub Token。'); return; }

    if (e.target.classList.contains('btn-edit')){
      showManageStatus('busy', '正在載入文章內容…');
      try {
        const postFile = await ghGetFile(cfg, slug + '.html');
        if (!postFile) throw new Error('找不到 ' + slug + '.html');
        const html = base64ToUtf8(postFile.content);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const article = doc.querySelector('article.prose');
        if (!article) throw new Error('無法解析這篇文章的內容區塊');
        const lead = article.querySelector('p.lead');
        if (lead) lead.remove();
        enterEditMode(post, article.innerHTML.trim());
        showManageStatus('ok', '已載入「' + esc(post.title) + '」,可以在上方編輯。');
      } catch(err){
        showManageStatus('err', '載入失敗:' + err.message);
      }
      return;
    }

    if (e.target.classList.contains('btn-toggle')){
      post.hidden = !post.hidden;
      showManageStatus('busy', (post.hidden ? '隱藏' : '顯示') + '中…');
      try {
        const res = await ghPutFile(cfg, 'posts.json', utf8ToBase64(JSON.stringify(currentPosts, null, 2) + '\n'), (post.hidden ? '隱藏文章: ' : '顯示文章: ') + post.title, currentPostsSha);
        currentPostsSha = res.content.sha;
        renderManageList();
        showManageStatus('ok', '已' + (post.hidden ? '隱藏' : '顯示') + '「' + esc(post.title) + '」。');
      } catch(err){
        post.hidden = !post.hidden;
        showManageStatus('err', '更新失敗:' + err.message);
      }
    }

    if (e.target.classList.contains('btn-delete')){
      if (!confirm('確定要刪除「' + post.title + '」嗎?這會從列表移除,並刪除對應的文章頁面,無法復原。(文章內插入過的圖片檔案不會一併刪除)')) return;
      showManageStatus('busy', '刪除中…');
      try {
        const postFile = await ghGetFile(cfg, slug + '.html');
        if (postFile){
          await ghDeleteFile(cfg, slug + '.html', '刪除文章: ' + post.title, postFile.sha);
        }
        currentPosts = currentPosts.filter(function(p){ return p.slug !== slug; });
        const res = await ghPutFile(cfg, 'posts.json', utf8ToBase64(JSON.stringify(currentPosts, null, 2) + '\n'), '刪除文章: ' + post.title, currentPostsSha);
        currentPostsSha = res.content.sha;
        renderManageList();
        showManageStatus('ok', '已刪除「' + esc(post.title) + '」。');
      } catch(err){
        showManageStatus('err', '刪除失敗:' + err.message);
      }
    }
  });
})();
</script>
